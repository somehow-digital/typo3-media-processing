name: SECURITY

on:
  workflow_call:
  merge_group:
  pull_request:
  push:
    branches:
      - main

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: scan source
        id: trufflehog
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc
        with:
          version: 3.99.9
      - name: evaluate results
        if: steps.trufflehog.outcome == 'failure'
        run: exit 1
